name: Notificacion DevOps

on:
  push:
    branches:
      - main

jobs:
  notificar:
    runs-on: ubuntu-latest

    steps:
      - name: Enviar notificacion
        run: |
          curl -H "Title: Nuevo codigo en GitHub" \
               -d "Se realizo un push a la rama main" \
               https://ntfy.sh/devops-itla
